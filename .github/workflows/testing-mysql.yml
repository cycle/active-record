---

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - 1.x

name: 🛢️ MySQL

permissions:
  contents: read

jobs:
  acceptance:
    name: MySQL · PHP ${{ matrix.php-version }}
    timeout-minutes: 8
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      group: mysql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php-version }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql
          ini-values: error_reporting=E_ALL

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: 🛢️ Start MySQL
        run: composer db:up -- mysql

      - name: 🧪 Run acceptance tests (MySQL)
        env:
          DB_REQUIRED: 1
        run: composer test:mysql
