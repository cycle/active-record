---

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - 1.x

name: 📀 SQLServer

permissions:
  contents: read

jobs:
  acceptance:
    name: SQLServer · PHP ${{ matrix.php-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      group: mssql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.php-version }}
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Install ODBC driver
        run: |
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: pecl
          extensions: mbstring, pdo, pdo_sqlite, sqlsrv, pdo_sqlsrv
          ini-values: error_reporting=E_ALL

      - name: 📥 Install dependencies with composer
        # TODO(cycle/testing): switch to the released package
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: 🛢️ Start SQLServer
        run: composer db:up -- sqlserver

      - name: 🧪 Run acceptance tests (SQLServer)
        env:
          DB_REQUIRED: 1
        run: composer test:sqlserver
