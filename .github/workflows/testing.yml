---

name: 🧪 Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - 1.x

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testo:
    uses: cycle/gh-actions/.github/workflows/testo.yml@master
    with:
      coverage: true
    secrets: inherit

...
